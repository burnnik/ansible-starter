---
- name: Create and load KSDS
  hosts: zos
  gather_facts: false
  collections:
    - ibm.ibm_zos_core
    - ansible.builtin
  environment: "{{ environment_vars }}"

  vars:
    vsam_name: GAMA10.VSAM.KSDS

  tasks:

    - name: Delete KSDS
      ibm.ibm_zos_core.zos_mvs_raw:
        program_name: IDCAMS
        auth: true
        dds:
          - dd_input:
              dd_name: SYSIN
              content: |
                DELETE {{ vsam_name }}
          - dd_output:
              dd_name: SYSPRINT
              return_content:
                type: text
      register: delete_result
      failed_when: false

    - name: Show KSDS delete result
      debug:
        var: delete_result

    - name: Delete input sequential data set
      zos_data_set:
        name: "{{ vsam_name }}.INPUT"
        state: absent
      register: delete_input_result

    - name: Show input data set delete result
      debug:
        var: delete_input_result

    - name: Create VSAM KSDS
      zos_data_set:
        name: "{{ vsam_name }}"
        type: ksds
        state: present
        record_format: fb
        record_length: 80
        space_primary: 2
        space_secondary: 1
        space_type: cyl
        key_length: 4
        key_offset: 0
      register: create_ksds_result

    - name: Show KSDS creation result
      debug:
        var: create_ksds_result

    - name: Create input sequential data set
      zos_data_set:
        name: "{{ vsam_name }}.INPUT"
        type: seq
        state: present
        record_format: fb
        record_length: 80
        space_primary: 1
        space_secondary: 1
        space_type: cyl
      register: create_input_result

    - name: Show input data set creation result
      debug:
        var: create_input_result

    - name: Populate input sequential data set
      zos_copy:
        content: |
          0001TEST RECORD 1
          0002TEST RECORD 2
        dest: "{{ vsam_name }}.INPUT"
      register: populate_input_result

    - name: Show populate input result
      debug:
        var: populate_input_result

    - name: Load records into KSDS using IDCAMS REPRO
      ibm.ibm_zos_core.zos_mvs_raw:
        program_name: IDCAMS
        auth: true
        dds:
          - dd_input:
              dd_name: SYSIN
              content: |
                REPRO INFILE(INDD) OUTDATASET({{ vsam_name }})
          - dd_data_set:
              dd_name: INDD
              data_set_name: "{{ vsam_name }}.INPUT"
          - dd_output:
              dd_name: SYSPRINT
              return_content:
                type: text
          - dd_output:
              dd_name: SYSOUT
              return_content:
                type: text
      register: load_ksds_result

    - name: Show load result
      debug:
        var: load_ksds_result